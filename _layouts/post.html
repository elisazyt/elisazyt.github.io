---
layout: default
---

<article class="container mx-auto px-2" itemscope itemtype="http://schema.org/BlogPosting">
  <div class="mt-4 mb-0 clearfix header-text post-header">
    <h1 class="h0 inline-block header-title">{{ page.title }}</h1>
  </div>

  <div class="prose post-body py-4" itemprop="articleBody">
      {% assign h2_count = content | split: "<h2" | size | minus: 1 %}
      {% if content contains "<blockquote" or h2_count > 1 %}
      <button type="button" class="expand-all-toggle" data-state="collapsed">
        <span class="expand-all-arrow"></span>
        <span class="expand-all-label">expand all</span>
      </button>
      {% endif %}
      {{ content }}
  </div>
</article>

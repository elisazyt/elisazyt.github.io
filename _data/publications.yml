# Two independent, optional link fields per entry:
#   url        - makes the title itself a link (the paper/venue page,
#                e.g. a DOI or arXiv link). Omit it and the title is
#                plain, unlinked text.
#   see_more   - adds a "see more" button linking to a fuller descriptive
#                page (normally the matching /projects/<slug>/ entry).
#                Omit it and no button renders.
# Either can be a full external URL or a site-relative path. `status`
# (published or in_progress) controls which subsection on /projects/ the
# entry renders under.

